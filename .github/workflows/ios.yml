name: Prime iOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prime-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/client.cjs
      - run: node tests/ios.cjs
      - name: Install isolated backend test dependency
        run: npm install --prefix "$RUNNER_TEMP/prime-test-deps" --ignore-scripts --no-audit --no-fund esbuild@0.25.12
      - name: Backend persistence and authorization tests
        run: NODE_PATH="$RUNNER_TEMP/prime-test-deps/node_modules" node tests/server.cjs

  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -project ios/Prime.xcodeproj -scheme Prime
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build-ci CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" build
      - name: Run iPhone UI tests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          printf 'prime-ci-empty' | xcrun simctl pbcopy "$DEVICE_ID"
          mkdir -p ci-artifacts
          xcodebuild -project ios/Prime.xcodeproj -scheme Prime -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build-ci -resultBundlePath ci-artifacts/PrimeUI.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" test
      - name: Collect isolated UI trace
        if: always()
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" com.literaturmasasi.prime data)
          if [ -f "$CONTAINER/Documents/ui-trace.log" ]; then cat "$CONTAINER/Documents/ui-trace.log"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prime-ios-simulator
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  release:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPhone Release archive
        run: >-
          xcodebuild -project ios/Prime.xcodeproj -scheme Prime
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build-release/Prime.xcarchive
          -derivedDataPath build-release/DerivedData
          CODE_SIGNING_ALLOWED=NO archive
      - name: Verify test controls are absent from Release executable
        run: |
          python3 - <<'PY'
          import pathlib, plistlib
          app = pathlib.Path("build-release/Prime.xcarchive/Products/Applications/Prime.app")
          info = plistlib.loads((app / "Info.plist").read_bytes())
          executable = (app / info["CFBundleExecutable"]).read_bytes()
          for marker in (b"--prime-ui-tests", b"--reset-test-state", b"prime-test-clipboard", b"ui-trace.log", b"Test: bildirim kaydedilemedi."):
              assert marker not in executable, f"Test control leaked into Release: {marker!r}"
          assert (app / "Web/index.html").is_file(), "Bundled UI missing"
          assert (app / "PrivacyInfo.xcprivacy").is_file(), "Privacy manifest missing"
          print("PASS: unsigned iPhone Release archive built; test controls absent; bundled UI and privacy manifest present.")
          PY
