name: Prime iOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prime-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/client.cjs
      - run: node tests/ios.cjs
      - name: Install isolated backend test dependency
        run: npm install --prefix "$RUNNER_TEMP/prime-test-deps" --ignore-scripts --no-audit --no-fund esbuild@0.25.12
      - name: Backend persistence and authorization tests
        run: NODE_PATH="$RUNNER_TEMP/prime-test-deps/node_modules" node tests/server.cjs

  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -project ios/Prime.xcodeproj -scheme Prime
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build-ci CODE_SIGNING_ALLOWED=NO build
      - name: Launch and capture Simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build-ci/Build/Products/Debug-iphonesimulator/Prime.app
          xcrun simctl launch "$DEVICE_ID" com.literaturmasasi.prime
          sleep 5
          mkdir -p ci-artifacts
          xcrun simctl io "$DEVICE_ID" screenshot ci-artifacts/login.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prime-ios-simulator
          path: ci-artifacts/
          if-no-files-found: ignore
