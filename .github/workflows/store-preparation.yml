name: App Store preparation audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/store-preparation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current App Store draft metadata
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, sign } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const required = ['ASC_KEY', 'ASC_KEY_ID', 'ASC_ISSUER'];
          for (const name of required) {
            if (!process.env[name]?.trim()) {
              console.error('Missing repository secret: ' + name);
              process.exit(1);
            }
          }
          let key;
          try {
            key = createPrivateKey(process.env.ASC_KEY.trim());
            if (key.asymmetricKeyType !== 'ec' || key.asymmetricKeyDetails?.namedCurve !== 'prime256v1') throw new Error();
          } catch {
            console.error('API key is not a valid P-256 private key. Check the complete .p8 secret.');
            process.exit(1);
          }
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = b64({alg:'ES256',kid:process.env.ASC_KEY_ID.trim(),typ:'JWT'})+'.'+b64({iss:process.env.ASC_ISSUER.trim(),iat:now-10,exp:now+300,aud:'appstoreconnect-v1'});
          const token=unsigned+'.'+sign('sha256',Buffer.from(unsigned),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
          console.log('::add-mask::'+token);
          async function get(route){
            const r=await fetch('https://api.appstoreconnect.apple.com'+route,{headers:{Authorization:'Bearer '+token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(30000)});
            const d=await r.json();if(!r.ok){console.log('AUDIT_ERROR '+JSON.stringify({route,status:r.status,codes:d.errors?.map(x=>x.code)}));return null}return d;
          }
          function report(label,d,fields){if(!d)return;for(const x of Array.isArray(d.data)?d.data:[d.data])if(x)console.log('STORE_AUDIT '+JSON.stringify({label,id:x.id,type:x.type,attributes:Object.fromEntries(fields.map(k=>[k,x.attributes?.[k]]))}));}
          report('app',await get('/v1/apps/6823890365'),['name','bundleId','primaryLocale','contentRightsDeclaration']);
          const versions=await get('/v1/apps/6823890365/appStoreVersions?filter[platform]=IOS&limit=20');
          report('versions',versions,['versionString','appStoreState','releaseType','copyright']);
          for(const v of versions?.data??[]){
            const locs=await get('/v1/appStoreVersions/'+v.id+'/appStoreVersionLocalizations');
            report('versionLocalizations',locs,['locale','description','keywords','marketingUrl','promotionalText','supportUrl','whatsNew']);
            for(const l of locs?.data??[])report('screenshots',await get('/v1/appStoreVersionLocalizations/'+l.id+'/appScreenshotSets'),['screenshotDisplayType']);
            const review=await get('/v1/appStoreVersions/'+v.id+'/appStoreReviewDetail');
            if(review?.data)console.log('REVIEW_COMPLETENESS '+JSON.stringify({id:review.data.id,fields:Object.fromEntries(['contactFirstName','contactLastName','contactPhone','contactEmail','demoAccountName','demoAccountPassword','notes'].map(k=>[k,Boolean(review.data.attributes?.[k])])),demoAccountRequired:review.data.attributes?.demoAccountRequired}));
            report('selectedBuild',await get('/v1/appStoreVersions/'+v.id+'/build'),['version','processingState','usesNonExemptEncryption']);
          }
          const infos=await get('/v1/apps/6823890365/appInfos');report('appInfos',infos,['appStoreState']);
          for(const i of infos?.data??[]){
            report('appInfoLocalizations',await get('/v1/appInfos/'+i.id+'/appInfoLocalizations'),['locale','name','subtitle','privacyPolicyUrl','privacyChoicesUrl']);
            report('ageRating',await get('/v1/appInfos/'+i.id+'/ageRatingDeclaration'),['advertising','medicalOrTreatmentInformation','healthOrWellnessTopics','userGeneratedContent','messagingAndChat','unrestrictedWebAccess','gambling','contests','ageAssurance','socialMedia','socialMediaAgeRestricted']);
          }
          JS

  screenshots:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Capture actual native app screens with isolated example data
        run: |
          python3 - <<'PY'
          import pathlib
          pathlib.Path("ios/PrimeUITests/PrimeFlowTests.swift").write_text("import XCTest\nfinal class PrimeFlowTests: XCTestCase {\n let app = XCUIApplication()\n func capture(_ name: String) { let a = XCTAttachment(screenshot: app.screenshot()); a.name = name; a.lifetime = .keepAlways; add(a) }\n func tap(_ name: String) { let e=app.webViews.buttons[name].firstMatch; XCTAssertTrue(e.waitForExistence(timeout:20)); e.tap() }\n func testStoreScreenshots() {\n  app.launchArguments=[\"--prime-ui-tests\",\"--reset-test-state\"]; app.launch()\n  XCTAssertTrue(app.webViews.buttons[\"Giriş yap\"].waitForExistence(timeout:20))\n  capture(\"store-01-login\")\n  for (i,d) in \"654321\".enumerated() {\n   let f=app.webViews.textFields[\"Kodun \\(i+1). hanesi\"]; XCTAssertTrue(f.waitForExistence(timeout:20)); f.tap(); f.typeText(String(d))\n   let value=NSPredicate(format:\"value == %@\",String(d)); expectation(for:value,evaluatedWith:f); waitForExpectations(timeout:10)\n  }\n  tap(\"Giriş yap\"); XCTAssertTrue(app.webViews.buttons[\"Ana Sayfa\"].waitForExistence(timeout:20))\n  capture(\"store-02-home\")\n  tap(\"Markalar\"); capture(\"store-03-brands\")\n  tap(\"Solgar kampanyasını aç\"); XCTAssertTrue(app.webViews.buttons[\"Kodu açmak için sağa kaydır veya Enter tuşuna bas\"].waitForExistence(timeout:20)); capture(\"store-04-detail\")\n  let favorite=app.webViews.switches[\"Solgar favorilere ekle\"].firstMatch\n  XCTAssertTrue(favorite.waitForExistence(timeout:20))\n  app.coordinate(withNormalizedOffset:.zero).withOffset(CGVector(dx:favorite.frame.midX,dy:favorite.frame.midY)).tap()\n  tap(\"Geri\"); tap(\"Favoriler\"); capture(\"store-05-favorites\")\n }\n}\n")
          PY
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"]=="iPhone 16 Pro"))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcodebuild -project ios/Prime.xcodeproj -scheme Prime -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build-store -resultBundlePath "$RUNNER_TEMP/Store.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" test
      - name: Export screen attachments
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Store.xcresult" --output-path "$RUNNER_TEMP/store-assets"
          ls -lh "$RUNNER_TEMP/store-assets"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: app-store-screen-captures
          path: ${{ runner.temp }}/store-assets/
      - name: Save generated preview assets on an isolated branch
        env:
          ASSET_BRANCH: app-store-assets-${{ github.run_id }}
        run: |
          git checkout --orphan "$ASSET_BRANCH"
          git rm -rf .
          cp -R "$RUNNER_TEMP/store-assets/." .
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Native App Store screenshot drafts from isolated sample data'
          git push origin "HEAD:refs/heads/$ASSET_BRANCH"
