name: Apple connection check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apple-connection.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Apple app and signing API access
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, sign } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const required = ['ASC_KEY', 'ASC_KEY_ID', 'ASC_ISSUER'];
          for (const name of required) {
            if (!process.env[name]?.trim()) {
              console.error('Missing repository secret: ' + name);
              process.exit(1);
            }
          }
          let key;
          try {
            key = createPrivateKey(process.env.ASC_KEY.trim());
            if (key.asymmetricKeyType !== 'ec' || key.asymmetricKeyDetails?.namedCurve !== 'prime256v1') throw new Error();
          } catch {
            console.error('API key is not a valid P-256 private key. Check the complete .p8 secret.');
            process.exit(1);
          }
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const routes = [
            '/v1/apps/6823890365',
            '/v1/bundleIds?filter[identifier]=com.literaturmasasi.prime',
            '/v1/certificates?filter[certificateType]=DISTRIBUTION&limit=200',
            '/v1/profiles?filter[profileType]=IOS_APP_STORE&limit=200',
          ];
          const unsigned = b64({ alg: 'ES256', kid: process.env.ASC_KEY_ID.trim(), typ: 'JWT' }) + '.' +
            b64({ iss: process.env.ASC_ISSUER.trim(), iat: now - 10, exp: now + 300, aud: 'appstoreconnect-v1' });
          const token = unsigned + '.' + sign('sha256', Buffer.from(unsigned), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          console.log('::add-mask::' + token);
          const report = [];
          for (const route of routes) {
            const response = await fetch('https://api.appstoreconnect.apple.com' + route, {
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
              redirect: 'error', signal: AbortSignal.timeout(30000),
            });
            const data = await response.json();
            const label = route.split('?')[0];
            if (!response.ok) {
              const codes = (data.errors ?? []).map(e => String(e.code).replace(/[^A-Z0-9_.-]/gi, '')).join(', ');
              report.push(label + ': HTTP ' + response.status + ' ' + codes);
              process.exitCode = 1;
              continue;
            }
            if (label.startsWith('/v1/apps/')) {
              if (data.data?.attributes?.bundleId !== 'com.literaturmasasi.prime') {
                report.push('FAIL: Apple app bundle ID does not match the project.');
                process.exitCode = 1;
              } else report.push('PASS: app 6823890365 matches com.literaturmasasi.prime.');
            } else if (label === '/v1/bundleIds') {
              if (!data.data?.some(x => x.attributes?.identifier === 'com.literaturmasasi.prime')) {
                report.push('FAIL: registered bundle ID not found.');
                process.exitCode = 1;
              } else report.push('PASS: registered bundle ID is accessible.');
            } else {
              report.push('PASS: ' + label + ' read permission; records returned: ' + (data.data?.length ?? 0) + '.');
            }
          }
          for (const line of report) console.log(line);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Apple connection verification\n\n' +
            report.map(x => '- ' + x).join('\n') +
            '\n\nRead-only verification. No certificates or profiles created, no keys exported, no build uploaded. Certificate/profile read access does not prove create access.\n');
          JS
