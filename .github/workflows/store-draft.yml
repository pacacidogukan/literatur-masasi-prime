name: Save App Store text draft

on:
  push:
    branches: [main]
    paths: ['.github/workflows/store-draft.yml', 'app-store/metadata.tr.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save and verify Turkish draft text
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, sign } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const required = ['ASC_KEY', 'ASC_KEY_ID', 'ASC_ISSUER'];
          for (const name of required) {
            if (!process.env[name]?.trim()) {
              console.error('Missing repository secret: ' + name);
              process.exit(1);
            }
          }
          let key;
          try {
            key = createPrivateKey(process.env.ASC_KEY.trim());
            if (key.asymmetricKeyType !== 'ec' || key.asymmetricKeyDetails?.namedCurve !== 'prime256v1') throw new Error();
          } catch {
            console.error('API key is not a valid P-256 private key. Check the complete .p8 secret.');
            process.exit(1);
          }
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned=b64({alg:'ES256',kid:process.env.ASC_KEY_ID.trim(),typ:'JWT'})+'.'+b64({iss:process.env.ASC_ISSUER.trim(),iat:now-10,exp:now+300,aud:'appstoreconnect-v1'});
          const token=unsigned+'.'+sign('sha256',Buffer.from(unsigned),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');console.log('::add-mask::'+token);
          async function api(route,method='GET',data){
            const r=await fetch('https://api.appstoreconnect.apple.com'+route,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined,redirect:'error',signal:AbortSignal.timeout(30000)});
            const d=await r.json();if(!r.ok)throw Error('Apple API '+r.status+' '+JSON.stringify(d.errors?.map(x=>({code:x.code,detail:x.detail}))));return d;
          }
          const draft=JSON.parse(readFileSync('app-store/metadata.tr.json','utf8'));
          if(draft.subtitle.length>30||draft.promotionalText.length>170||draft.keywords.length>100||draft.description.length>4000)throw Error('Store text length exceeded');
          const versions=await api('/v1/apps/6823890365/appStoreVersions?filter[platform]=IOS');
          const v=versions.data.find(x=>x.attributes.versionString==='1.0'&&x.attributes.appStoreState==='PREPARE_FOR_SUBMISSION');
          if(!v)throw Error('Editable 1.0 draft not found; refusing to change any other version');
          const locs=await api('/v1/appStoreVersions/'+v.id+'/appStoreVersionLocalizations');
          const l=locs.data.find(x=>x.attributes.locale==='tr');if(!l)throw Error('Turkish version locale missing');
          const attrs=Object.fromEntries(['description','keywords','promotionalText'].map(k=>[k,draft[k]]));
          await api('/v1/appStoreVersionLocalizations/'+l.id,'PATCH',{type:'appStoreVersionLocalizations',id:l.id,attributes:attrs});
          const info=(await api('/v1/apps/6823890365/appInfos')).data.find(x=>x.attributes.appStoreState==='PREPARE_FOR_SUBMISSION');
          if(!info)throw Error('Editable app info not found');
          const il=(await api('/v1/appInfos/'+info.id+'/appInfoLocalizations')).data.find(x=>x.attributes.locale==='tr');
          if(!il||il.attributes.name!==draft.name)throw Error('Store name differs from expected name; refusing to rename');
          await api('/v1/appInfoLocalizations/'+il.id,'PATCH',{type:'appInfoLocalizations',id:il.id,attributes:{subtitle:draft.subtitle}});
          const saved=await api('/v1/appStoreVersionLocalizations/'+l.id);
          for(const k of Object.keys(attrs))if(saved.data.attributes[k]!==attrs[k])throw Error('Draft verification failed: '+k);
          const savedInfo=await api('/v1/appInfoLocalizations/'+il.id);
          if(savedInfo.data.attributes.subtitle!==draft.subtitle)throw Error('Subtitle verification failed');
          console.log('STORE_DRAFT_SAVED '+JSON.stringify({version:'1.0',locale:'tr',name:savedInfo.data.attributes.name,subtitle:savedInfo.data.attributes.subtitle,fields:Object.keys(attrs),submitted:false}));
          JS
